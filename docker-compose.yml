version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: licarl
      POSTGRES_PASSWORD: licarl_secret
      POSTGRES_DB: licarl_prompt_maker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U licarl']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://licarl:licarl_secret@postgres:5432/licarl_prompt_maker?schema=public
      JWT_SECRET: change-me-in-production-use-long-secret
      ENCRYPTION_KEY: change-me-32-byte-key-here!!!!!!!!
      PORT: 3001
      APP_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
